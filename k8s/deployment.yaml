apiVersion: apps/v1
kind: Deployment
metadata:
  name: biga-fleet-api
  namespace: biga-fleet
  labels:
    app: biga-fleet-api
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biga-fleet-api
  template:
    metadata:
      labels:
        app: biga-fleet-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "2342"
    spec:
      containers:
        - name: api
          image: biga-fleet/manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2342
          envFrom:
            - configMapRef:
                name: biga-fleet-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

